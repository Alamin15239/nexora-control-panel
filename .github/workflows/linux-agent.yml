name: Linux agent CI

on:
  push:
    paths:
      - "agents/linux-agent/**"
      - "scripts/setup-cloudflare-tunnel.sh"
      - "scripts/start-cloudflare-quick-tunnel.sh"
      - "scripts/update-linux-agent.sh"
      - "scripts/preflight-static-deployment-node.sh"
      - "scripts/test_static_deployment_preflight.py"
      - "scripts/install-static-deployment-node.sh"
      - "scripts/test_static_deployment_installer.py"
      - "docs/cloudflare-tunnel-node.md"
      - ".github/workflows/linux-agent.yml"
  pull_request:
    paths:
      - "agents/linux-agent/**"
      - "scripts/preflight-static-deployment-node.sh"
      - "scripts/test_static_deployment_preflight.py"
      - "scripts/install-static-deployment-node.sh"
      - "scripts/test_static_deployment_installer.py"
      - ".github/workflows/linux-agent.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/linux-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: agents/linux-agent/go.mod
      - name: Provisioner unit tests
        run: go test ./cmd/nexora-provision
      - name: Full test suite
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Install Nginx for isolated serving integration test
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
      - name: Verify real Nginx release switching and PHP isolation
        env:
          NEXORA_NGINX_INTEGRATION: "1"
        run: go test ./internal/staticvhost -run '^TestNginxServesAtomicReleaseSwitch$' -count=1 -v
      - name: Vet
        run: go vet ./...
      - name: Build
        run: |
          go build -trimpath -ldflags="-s -w" -o /tmp/nexora-agent ./cmd/nexora-agent
          go build -trimpath -ldflags="-s -w" -o /tmp/nexora-runtime-node ./cmd/nexora-runtime-node
          go build -trimpath -ldflags="-s -w" -o /tmp/nexora-static-publisher ./cmd/nexora-static-publisher
          go build -trimpath -ldflags="-s -w" -o /tmp/nexora-provision ./cmd/nexora-provision
          go build -trimpath -ldflags="-s -w" -o /tmp/nexora-provisiond ./cmd/nexora-provisiond
          go build -trimpath -ldflags="-s -w" -o /tmp/nexora-static-vhostd ./cmd/nexora-static-vhostd
      - name: Verify CLI
        run: /tmp/nexora-agent version
      - name: Verify provisioning systemd unit
        run: |
          sudo install -D -o root -g root -m 0755 /tmp/nexora-provisiond /usr/local/sbin/nexora-provisiond
          # The publisher's primary group must be www-data so its new release
          # directories are traversable by Nginx; broker IPC stays supplementary.
          grep -Fxq 'User=nexora-runtime' systemd/nexora-static-publisher.service
          grep -Fxq 'Group=www-data' systemd/nexora-static-publisher.service
          grep -Fxq 'SupplementaryGroups=nexora-static' systemd/nexora-static-publisher.service
          sudo install -D -o root -g root -m 0755 /tmp/nexora-static-vhostd /usr/local/sbin/nexora-static-vhostd
          sudo install -D -o root -g root -m 0644 systemd/nexora-static-vhostd.service /etc/systemd/system/nexora-static-vhostd.service
          sudo install -D -o root -g root -m 0755 /tmp/nexora-runtime-node /usr/local/bin/nexora-runtime-node
          sudo install -D -o root -g root -m 0755 /tmp/nexora-static-publisher /usr/local/bin/nexora-static-publisher
          systemd-analyze verify systemd/nexora-provisiond.service systemd/nexora-runtime-node.service systemd/nexora-static-publisher.service systemd/nexora-static-vhostd.service
      - name: Validate Cloudflare Tunnel installer syntax
        run: |
          bash -n ../../scripts/setup-cloudflare-tunnel.sh
          bash -n ../../scripts/start-cloudflare-quick-tunnel.sh
          bash -n ../../scripts/update-linux-agent.sh
          bash -n ../../scripts/preflight-static-deployment-node.sh
          python3 ../../scripts/test_static_deployment_preflight.py
