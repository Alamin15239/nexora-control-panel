name: Deploy Nexora API to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/cloudflare-api/src/**"
      - "apps/cloudflare-api/migrations/**"
      - "apps/cloudflare-api/wrangler.toml"
      - "apps/cloudflare-api/package.json"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: nexora-api-production
  cancel-in-progress: false

jobs:
  deploy-api:
    if: github.ref == 'refs/heads/main'
    name: Typecheck, migrate and deploy nexora-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter @nexora/cloudflare-api typecheck

      - name: Apply D1 migrations
        run: pnpm --filter @nexora/cloudflare-api exec wrangler d1 migrations apply nexora-production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API Worker
        run: pnpm --filter @nexora/cloudflare-api exec wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
