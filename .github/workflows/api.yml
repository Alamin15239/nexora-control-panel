name: Control plane API CI

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/cloudflare-api/**"
      - "packages/database/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/api.yml"
      - ".github/workflows/deploy-api.yml"
      - "docs/templates/nexora-deploy.yml"
      - "scripts/test_nexora_deploy_workflow.py"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/cloudflare-api/**"
      - "packages/database/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/api.yml"
      - ".github/workflows/deploy-api.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://nexora:nexora@localhost:5432/nexora
        run: pnpm --filter @nexora/database db:generate
      - name: API unit tests
        run: pnpm --filter @nexora/api test
      - name: API typecheck
        run: pnpm --filter @nexora/api typecheck
      - name: Cloudflare API typecheck
        run: pnpm --filter @nexora/cloudflare-api typecheck
      - name: Cloudflare API runtime admission regression tests
        run: node --experimental-strip-types --test apps/cloudflare-api/scripts/runtime-admission.test.ts
      - name: Cloudflare API monthly build quota regression tests
        run: node --experimental-strip-types --test apps/cloudflare-api/scripts/build-quota.test.ts
      - name: Cloudflare API database secret encryption tests (Fix 5)
        run: pnpm --filter @nexora/api exec tsx --test ../cloudflare-api/scripts/database-secret-encryption.test.ts
      - name: Cloudflare API backup scheduler recurrence tests (Fix 3)
        run: pnpm --filter @nexora/api exec tsx --test ../cloudflare-api/scripts/backup-scheduler-recurrence.test.ts
      - name: Cloudflare D1 migration and tenant-isolation tests
        run: python3 apps/cloudflare-api/scripts/test_migrations.py
      - name: Application-node, artifact, release and rollback integration tests
        run: pnpm --filter @nexora/api exec tsx --test ../cloudflare-api/scripts/application-*.integration.test.ts
      - name: Database password reset integration tests (Fix 1)
        run: pnpm --filter @nexora/api exec tsx --test ../cloudflare-api/scripts/database-password-reset.integration.test.ts
      - name: Backup concurrency exclusion tests
        run: pnpm --filter @nexora/api exec tsx --test ../cloudflare-api/scripts/backup-concurrency.integration.test.ts
      - name: Validate Nexora static deployment workflow security contract
        run: python3 scripts/test_nexora_deploy_workflow.py
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://nexora:nexora@localhost:5432/nexora
        run: pnpm --filter @nexora/database db:validate
