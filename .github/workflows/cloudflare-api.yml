name: Validate Nexora API changes

on:
  push:
    paths:
      - "apps/cloudflare-api/**"
      - "apps/api/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/cloudflare-api.yml"
  pull_request:
    paths:
      - "apps/cloudflare-api/**"
      - "apps/api/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/cloudflare-api.yml"

permissions:
  contents: read

jobs:
  cloudflare-api:
    name: Cloudflare API typecheck, migrations and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck Cloudflare Worker
        run: pnpm --filter @nexora/cloudflare-api typecheck
      - name: Test D1 migrations and tenant isolation constraints
        run: python3 apps/cloudflare-api/scripts/test_migrations.py
      - name: Test runtime admission policy
        run: node --experimental-strip-types --test apps/cloudflare-api/scripts/runtime-admission.test.ts
      - name: Test application API integration contracts
        run: pnpm --filter @nexora/api exec tsx --test ../cloudflare-api/scripts/application-*.integration.test.ts
      - name: Validate deployment workflow security contract
        run: python3 scripts/test_nexora_deploy_workflow.py
